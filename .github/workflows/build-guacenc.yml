name: Build guacenc (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            libtool
            pkg-config
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libpng

      - name: Clone guacamole-server
        run: |
          git clone --depth=1 --branch=1.5.5 https://github.com/apache/guacamole-server.git

      - name: Apply Windows patches
        working-directory: guacamole-server
        run: |
          echo "Applying Windows compatibility patches..."

          # Patch 1: Skip timer_create check
          sed -i 's/AC_SEARCH_LIBS([^)]*timer_create[^)]*)/true/' configure.ac

          # Patch 2: Skip dlopen check
          sed -i '/AC_CHECK_FUNC.*dlopen/,+6d' configure.ac

          # Patch 3: Skip libuuid check
          sed -i '/AC_CHECK_LIB.*uuid/,+6d' configure.ac

          # Patch 4: Disable POSIX file locking in encode.c
          sed -i '/struct flock file_lock/,+20d' src/guacenc/encode.c

          echo "Patches applied successfully."

      - name: Autoreconf
        working-directory: guacamole-server
        run: |
          autoreconf -fi

      - name: Configure
        working-directory: guacamole-server
        run: |
          ./configure \
            --disable-guacd \
            --without-libuuid \
            --disable-shared \
            --enable-static

      - name: Build guacenc
        working-directory: guacamole-server
        run: |
          make -C src/guacenc -j$(nproc)

          echo "=== Listing src/guacenc directory ==="
          ls -lh src/guacenc

          cp src/guacenc/guacenc.exe ../guacenc.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: guacenc-windows
          path: guacenc.exe
