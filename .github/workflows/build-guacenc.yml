name: Build guacenc (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            libtool
            pkg-config
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libpng

      - name: Build guacenc
        shell: C:\msys64\ucrt64\bin\bash.exe --noprofile --norc -eo pipefail {0}
        run: |
          git clone --depth=1 --branch=1.5.5 https://github.com/apache/guacamole-server.git
          cd guacamole-server

          # patch（和之前一样）
          sed -i 's/AC_SEARCH_LIBS([^)]*timer_create[^)]*)/true/' configure.ac
          sed -i '/AC_CHECK_FUNC.*dlopen/,+6d' configure.ac
          sed -i '/AC_CHECK_LIB.*uuid/,+6d' configure.ac
          sed -i '/struct flock file_lock/,+20d' src/guacenc/encode.c

          autoreconf -fi

          ./configure \
            --disable-guacd \
            --without-libuuid \
            --disable-shared \
            --enable-static

          make -C src/guacenc -j$(nproc)

          cp src/guacenc/guacenc.exe $HOME/guacenc.exe

      - uses: actions/upload-artifact@v4
        with:
          name: guacenc-windows
          path: $HOME/guacenc.exe