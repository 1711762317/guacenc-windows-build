name: Build guacenc (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            libtool
            pkg-config
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libpng

      - name: Build guacenc
        run: |
          cd guacamole-server
          autoreconf -fi
          ./configure \
            --disable-guacd \
            --without-libuuid \
            --disable-shared \
            --enable-static
          make -C src/guacenc -j$(nproc)
          cp src/guacenc/guacenc.exe /c/Users/runneradmin/guacenc.exe

      - uses: actions/upload-artifact@v4
        with:
          name: guacenc-windows
          path: C:\Users\runneradmin\guacenc.exe